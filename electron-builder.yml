appId: com.grimoire.modmanager
productName: Grimoire
# GameBanana 1-Click Mod Installer protocol registration
protocols:
  - name: Grimoire 1-Click Installer
    schemes:
      - grimoire
# GitHub auto-update configuration
publish:
  provider: github
  owner: Slush97
  repo: grimoire
directories:
  output: release
  buildResources: resources
files:
  - dist/**/*
  - "!node_modules/**/*"
  # Include required runtime dependencies
  - node_modules/adm-zip/**/*
  - node_modules/better-sqlite3/**/*
  - node_modules/bindings/**/*
  - node_modules/file-uri-to-path/**/*
  - node_modules/node-7z/**/*
  - node_modules/node-unrar-js/**/*
  - node_modules/7zip-bin/**/*
  - node_modules/cross-spawn/**/*
  - node_modules/shebang-command/**/*
  - node_modules/shebang-regex/**/*
  - node_modules/which/**/*
  - node_modules/isexe/**/*
  - node_modules/path-key/**/*
asarUnpack:
  - node_modules/better-sqlite3/**/*
  - node_modules/node-unrar-js/**/*
  - node_modules/7zip-bin/**/*
# vpkmerge CLI binary (fetched via scripts/fetch-vpkmerge.mjs) ships outside
# the asar so the OS can execute it directly. Resolved at runtime via
# process.resourcesPath.
extraResources:
  - from: resources/vpkmerge
    to: vpkmerge
    filter:
      - "**/*"
      - "!*.bak"
linux:
  target:
    - AppImage
    - deb
  category: Game
  icon: resources/icons
  maintainer: esoc
win:
  target:
    - nsis
    - portable
  icon: resources/icon.ico
# macOS runs Deadlock through a CrossOver bottle (see docs/macos.md), so the
# audience is Apple Silicon only in practice.
#
# There is no Developer ID cert. identity is pinned to null so electron-builder
# never auto-discovers the local Apple Development cert (which is not valid for
# distribution and would fail on every other machine). Skipping electron-builder
# signing leaves the bundle with an INVALID signature, which macOS reports as
# "damaged", so scripts/adhoc-sign-mac.mjs re-signs ad-hoc afterwards. Users
# still get the "unidentified developer" prompt on first launch.
mac:
  target:
    - dmg
    - zip
  category: public.app-category.games
  icon: resources/icon.png
  identity: null
afterPack: scripts/adhoc-sign-mac.mjs
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  menuCategory: true
  shortcutName: Grimoire
  uninstallDisplayName: Grimoire Mod Manager
  artifactName: "${productName}-Setup-${version}.${ext}"
portable:
  artifactName: "${productName}-Portable-${version}.${ext}"
